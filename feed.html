<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 用户发布的内容,不进搜索索引 -->
<meta name="robots" content="noindex">
<title>动态 — 一杆高尔夫</title>
<meta name="description" content="球友在一杆高尔夫分享的打球记录与动态。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .feed { max-width: 680px; }
  .post { background: var(--fill); border-radius: var(--r-card); padding: 16px 16px 14px; margin-bottom: 14px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 38px; height: 38px; border-radius: 50%; background: var(--line); object-fit: cover; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--sub); }
  .who b { font-size: 15px; display: block; line-height: 1.3; }
  .who span { font-size: 12.5px; color: var(--sub); }
  .text { margin-top: 10px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .round { margin-top: 10px; background: #fff; border-radius: var(--r-btn); padding: 12px 14px; display: flex; align-items: baseline; gap: 12px; }
  .round .score { font-size: 28px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .round .score small { font-size: 14px; font-weight: 600; }
  .round .desc { font-size: 13.5px; color: var(--sub); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .photos img { aspect-ratio: 1; object-fit: cover; border-radius: 6px; width: 100%; background: var(--line); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stats { font-size: 13px; color: var(--sub); margin-top: 10px; display: flex; gap: 16px; }
  .cmts { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
  .cmts div { margin: 3px 0; word-break: break-word; }
  .cmts b { font-weight: 600; }
  .tip { font-size: 13.5px; }
</style>
</head>
<body>
<nav id="site-nav" data-active="feed"></nav>
<main class="wrap">
  <div class="page-head">
    <h1>动态</h1>
    <p>球友分享的打球记录与动态。发布入口在一杆高尔夫小程序和 App 里，发布的内容都按<a href="/review.html" style="text-decoration:underline;text-underline-offset:3px">信息发布审核机制</a>管理。</p>
  </div>
  <div class="feed">
    <div id="list"></div>
    <div class="state" id="state">加载中…</div>
    <div class="more" id="more" hidden><button class="btn btn-secondary" id="moreBtn" type="button">加载更多</button></div>
    <p class="tip muted">看到违法或不良信息？可在 App / 小程序内点「举报」，或发邮件至 <a href="mailto:contact@hiogolf.cn">contact@hiogolf.cn</a>。</p>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
<script>
(function () {
  // 一页取满 50 条(后端上限):推荐流按回合/帖子两路各取一页再合并截断,页太小会把图文帖永久挤掉
  var H = window.HIO, page = 1, size = 50, busy = false;
  var list = document.getElementById('list'), state = document.getElementById('state'), more = document.getElementById('more');
  function avatar(u) {
    var src = H.safeImg(u && u.avatarUrl);
    var name = (u && u.nickname) || '球友';
    return src ? '<img class="av" src="' + src + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '<div class="av">' + H.esc(name.slice(0, 1)) + '</div>';
  }
  function roundLabel(it) {
    var holes = it.roundType === 'FRONT_9' || it.roundType === 'BACK_9' ? '9 洞' : (it.roundType ? '18 洞' : '');
    return [it.courseName, holes].filter(Boolean).join(' · ');
  }
  function post(it) {
    var u = it.user || {};
    var when = H.fmtTime(it.completedAt || it.playedAt || it.playAt);
    var meta = [when, it.ipRegion ? 'IP 属地：' + it.ipRegion : ''].filter(Boolean).join(' · ');
    var body = '';
    if (it.postText) body += '<div class="text">' + H.esc(it.postText) + '</div>';
    if (it.postType === 'ROUND' && it.totalScore != null) {
      body += '<div class="round"><div class="score">' + H.esc(it.totalScore) + '<small> 杆</small></div><div class="desc">完成一场记分 · ' + H.esc(roundLabel(it)) + '</div></div>';
    } else if (it.courseName) {
      body += '<div class="tags"><span class="tag">' + H.esc(it.courseName) + '</span></div>';
    }
    var photos = (it.photoUrls || []).map(H.safeImg).filter(Boolean).slice(0, 9);
    if (photos.length) body += '<div class="photos">' + photos.map(function (p) { return '<img src="' + p + '" alt="" loading="lazy" referrerpolicy="no-referrer">'; }).join('') + '</div>';
    var tags = (it.tags || []).slice(0, 5);
    if (tags.length) body += '<div class="tags">' + tags.map(function (t) { return '<span class="tag">#' + H.esc(t) + '</span>'; }).join('') + '</div>';
    body += '<div class="stats"><span>赞 ' + (it.likeCount || 0) + '</span><span>评论 ' + (it.commentCount || 0) + '</span></div>';
    var cmts = (it.comments || []).slice(-3);
    if (cmts.length) body += '<div class="cmts">' + cmts.map(function (c) {
      var who = H.esc((c.user && c.user.nickname) || '球友');
      var to = c.replyToUser && c.replyToUser.nickname ? ' 回复 ' + H.esc(c.replyToUser.nickname) : '';
      return '<div><b>' + who + '</b>' + to + '：' + H.esc(c.content) + '</div>';
    }).join('') + '</div>';
    return '<article class="post"><div class="who">' + avatar(u) + '<div><b>' + H.esc(u.nickname || '球友') + '</b><span>' + H.esc(meta) + '</span></div></div>' + body + '</article>';
  }
  function load() {
    if (busy) return; busy = true;
    state.hidden = false; state.textContent = '加载中…'; more.hidden = true;
    H.api('/feed?page=' + page + '&size=' + size)
      .then(function (rows) {
        rows = rows || [];
        list.insertAdjacentHTML('beforeend', rows.map(post).join(''));
        var shown = list.children.length;
        state.hidden = shown > 0; state.textContent = shown ? '' : '还没有动态';
        more.hidden = rows.length < size;
        page++;
      })
      .catch(function () { state.hidden = false; state.textContent = '加载失败，请稍后刷新重试'; })
      .then(function () { busy = false; });
  }
  document.getElementById('moreBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
