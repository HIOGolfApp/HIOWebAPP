<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>球场 — 一杆高尔夫</title>
<meta name="description" content="一杆高尔夫收录的高尔夫球场:球场名称、所在城市、球洞数与 GPS 测距支持情况。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .search { display: flex; gap: 10px; margin: 4px 0 20px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: #fff; }
  .search input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .course { background: var(--fill); border-radius: var(--r-card); overflow: hidden; }
  .course .cover { aspect-ratio: 16 / 9; background: var(--line); object-fit: cover; width: 100%; }
  .course .body { padding: 12px 14px 14px; }
  .course h3 { font-size: 15.5px; line-height: 1.4; }
  .course .meta { font-size: 13px; color: var(--sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
</style>
</head>
<body>
<nav id="site-nav" data-active="courses"></nav>
<main class="wrap">
  <div class="page-head">
    <h1>球场</h1>
    <p>一杆高尔夫收录的高尔夫球场。标注「GPS 测距」的球场，可以在 App 和小程序里看洞图、实时测距。</p>
  </div>
  <form class="search" id="f" role="search">
    <input id="q" type="search" placeholder="搜索球场名称" maxlength="30" autocomplete="off">
    <button class="btn btn-primary" type="submit">搜索</button>
  </form>
  <div class="grid" id="list"></div>
  <div class="state" id="state">加载中…</div>
  <div class="more" id="more" hidden><button class="btn btn-secondary" id="moreBtn" type="button">加载更多</button></div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
<script>
(function () {
  var H = window.HIO, page = 1, size = 24, keyword = '', busy = false, seq = 0;
  var list = document.getElementById('list'), state = document.getElementById('state'), more = document.getElementById('more');
  function card(c) {
    var img = H.safeImg(c.coverUrl);
    var where = [c.province, c.city].filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' · ');
    return '<div class="course">'
      + (img ? '<img class="cover" src="' + img + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">' : '<div class="cover"></div>')
      + '<div class="body"><h3>' + H.esc(c.name) + '</h3><div class="meta">'
      + (where ? '<span>' + H.esc(where) + '</span>' : '')
      + (c.holeCount ? '<span class="tag">' + H.esc(c.holeCount) + ' 洞</span>' : '')
      + (c.gpsMapped ? '<span class="tag dark">GPS 测距</span>' : '')
      + '</div></div></div>';
  }
  function load(reset) {
    // 新搜索不受进行中的请求阻挡;旧请求晚到的结果按序号丢弃
    if (busy && !reset) return;
    busy = true;
    var my = ++seq;
    if (reset) { page = 1; list.innerHTML = ''; }
    state.hidden = false; state.textContent = '加载中…'; more.hidden = true;
    H.api('/courses?page=' + page + '&size=' + size + (keyword ? '&keyword=' + encodeURIComponent(keyword) : ''))
      .then(function (d) {
        if (my !== seq) return;
        var rows = (d && d.records) || [];
        list.insertAdjacentHTML('beforeend', rows.map(card).join(''));
        var shown = list.children.length;
        state.hidden = shown > 0; state.textContent = shown ? '' : '没有找到相关球场';
        more.hidden = !(d && d.total > shown);
        page++;
      })
      .catch(function () { if (my === seq) { state.hidden = false; state.textContent = '加载失败，请稍后刷新重试'; } })
      .then(function () { if (my === seq) busy = false; });
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); keyword = document.getElementById('q').value.trim(); load(true); });
  document.getElementById('moreBtn').addEventListener('click', function () { load(false); });
  load(true);
})();
</script>
</body>
</html>
