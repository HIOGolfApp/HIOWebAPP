# hiogolf.cn / www.hiogolf.cn — official website (static) + same-origin API proxy.
# Replaces the old aigolf-root.conf (which proxied the root domain to the backend);
# the App talks to api.hiogolf.cn, so the root domain is free for the website.
#
# Canonical host is www.hiogolf.cn. The bare domain hiogolf.cn only serves
# /.well-known/ (Apple fetches the AASA file without following redirects) and
# 301s everything else to https://www.hiogolf.cn$request_uri.
#
# Server is nginx 1.14: keep to 1.14 syntax (old-style `listen ... ssl http2`, no `http2 on`).
#
# First install (once):
#   git clone git@github.com:HIOGolfApp/HIOWebAPP.git /opt/hio-website
#   cp /opt/hio-website/nginx/hiogolf-site.conf /etc/nginx/conf.d/hiogolf-site.conf
#   rm -f /etc/nginx/conf.d/aigolf-root.conf
#   nginx -t && systemctl reload nginx
#
# Update (do NOT use a bare `git pull`: the server's origin is HTTPS, and HTTPS to
# GitHub from this CVM hangs intermittently with no output; the SSH protocol is reliable):
#   cd /opt/hio-website \
#     && timeout 60 git fetch git@github.com:HIOGolfApp/HIOWebAPP.git main \
#     && git merge --ff-only FETCH_HEAD \
#     && git rev-parse --short HEAD          # check HEAD really moved to the new commit
# Static files take effect immediately. When THIS conf file changed, also:
#   cp /opt/hio-website/nginx/hiogolf-site.conf /etc/nginx/conf.d/hiogolf-site.conf
#   nginx -t && systemctl reload nginx
# then re-check with curl (AASA 200 on both hosts, /.git/HEAD 404, bare domain 301 -> www).

# WebSocket upgrade map used by aigolf.conf / aigolf-ip.conf proxy headers;
# it used to live in the retired aigolf-root.conf, so it moves here with the
# root-domain takeover (conf.d files are included at http level).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hiogolf.cn www.hiogolf.cn;

    # keep /.well-known/ on the same host (certificate file validation etc.)
    location /.well-known/ {
        return 301 https://$host$request_uri;
    }
    location / {
        return 301 https://www.hiogolf.cn$request_uri;
    }
}

# ---------------------------------------------------------------------------
# bare domain: only /.well-known/ is served here, everything else -> www
# ---------------------------------------------------------------------------
server {
    # nginx 1.14 on the CVM: old-style http2 flag on listen (http2-on directive is 1.25+)
    listen 443 ssl http2;
    server_name hiogolf.cn;

    ssl_certificate     /etc/nginx/ssl/hiogolf.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/hiogolf.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hio-website;

    # iOS Universal Links: Apple's CDN fetches https://hiogolf.cn/.well-known/apple-app-site-association
    # and does NOT follow redirects, so it must be a direct 200 with a JSON content type.
    # Same content as https://api.hiogolf.cn/.well-known/apple-app-site-association.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # the site root is a git checkout: never serve dotfiles (.git/, .gitignore) or repo internals
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(scripts|nginx|docs|tee/test)(/|$) { return 404; }
    location ~ ^/(README\.md|\.gitignore)$ { return 404; }

    location /.well-known/ {
        try_files $uri =404;
    }

    # course cover images are stored in the DB as https://hiogolf.cn/img/courses/*.jpg; the mini program
    # loads them via wx.getImageInfo (downloadFile allow-list = hiogolf.cn), which fails on a cross-domain
    # redirect, so /img/ is served directly on the bare domain instead of 301-ing to www.
    location /img/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://www.hiogolf.cn$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www.hiogolf.cn: the website
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.hiogolf.cn;

    ssl_certificate     /etc/nginx/ssl/hiogolf.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/hiogolf.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hio-website;
    index index.html;

    # Access-log redaction (lat/lng/token query strings), paired with HIO-backend nginx/00-hio-log-redact.conf.
    # Enable ONLY after that snippet is installed as /etc/nginx/conf.d/00-hio-log-redact.conf
    # (it defines log_format hio_redacted; without it `nginx -t` fails):
    # access_log /var/log/nginx/access.log hio_redacted;

    # iOS Universal Links (see the bare-domain block above)
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # the site root is a git checkout: never serve dotfiles (.git/, .gitignore) or repo internals.
    # Regex locations are checked in order, so these must stay above the landing-page routes.
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(scripts|nginx|docs|tee/test)(/|$) { return 404; }
    location ~ ^/(README\.md|\.gitignore)$ { return 404; }

    # 按 IP 限流:zone 定义在后端仓库 nginx/aigolf-ratelimit.conf(装在 /etc/nginx/conf.d/),
    # 与 api.hiogolf.cn / 裸 IP 用同名 zone,同一 IP 换入口计数照样累加。
    # 部署顺序:服务器上先装好那份 zone 文件(后端 scripts/install-nginx-limits.sh)。没装时
    # deploy-site.sh 会跳过本文件、只上静态文件并打 WARN;装好后重跑 deploy-site.sh 即可。
    error_page 429 = @hio_429;
    location @hio_429 {
        access_log /var/log/nginx/hio-429.log;
        default_type "application/json; charset=utf-8";
        add_header Retry-After 10 always;
        return 429 '{"code":42990,"message":"请求过于频繁，请稍后再试","data":null}';
    }

    # same-origin proxy for the public, no-auth endpoints only
    # (/public-api/v1/public/... -> backend /api/v1/public/...)
    location /public-api/v1/public/ {
        limit_req zone=hio_api    burst=500 nodelay;
        limit_req zone=hio_public burst=60  nodelay;
        proxy_pass http://aigolf_app/api/v1/public/;   # blue/green upstream, see /etc/nginx/conf.d/aigolf-upstream.conf
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 球场端 Tee Time 控制台(/tee/index.html)与球员/球童实时页(/tee/live.html):
    # 同源反代到后端 tee 模块(需登录,Authorization 头透传) /tee-api/v1/* -> /api/v1/tee/*
    # 后端未上线时接口报错,页面自动退回「演示模式」(本地模拟数据),不影响静态页访问。
    location /tee-api/v1/ {
        limit_req zone=hio_api burst=500 nodelay;
        proxy_pass http://aigolf_app/api/v1/tee/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 阶段 3(可选)WebSocket 增量推送,复用文件顶部的 connection_upgrade map:
    # location /tee-api/v1/ws {
    #     proxy_pass http://aigolf_app/api/v1/tee/ws;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_read_timeout 3600s;
    # }

    # ---- 分享落地页(全部 noindex):每类链接落到同一张静态页,页内 JS 从路径取参数拉公开数据 ----
    # 装了 App 的 iPhone 点这些链接由系统直接打开 App(AASA paths /m/* /i/* /g/* /e/* /c/*),不会走到这里。
    # api.hiogolf.cn 上同名路径的浏览器兜底由后端 UniversalLinkController 302 过来。

    # 约球:/m/{postId}
    location ~ ^/m/\d+/?$ {
        try_files /meetup.html =404;
    }

    # 好友邀请:/i/{HIO_ID}
    location ~ ^/i/[A-Za-z0-9]+/?$ {
        try_files /invite.html =404;
    }

    # 比赛:/e/{eventId}(公开赛)或 /e/{eventId}/{邀请码}(私密赛)
    location ~ ^/e/\d+(/[A-Za-z0-9]+)?/?$ {
        try_files /event.html =404;
    }

    # 记分球局:/g/{groupId}/{分享码}
    location ~ ^/g/\d+/[A-Za-z0-9]+/?$ {
        try_files /round.html =404;
    }

    # 球童报到:/c/{报到码}
    location ~ ^/c/[A-Za-z0-9]+/?$ {
        try_files /caddie.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
