# hiogolf.cn / www.hiogolf.cn — official website (static) + same-origin API proxy.
# Replaces the old aigolf-root.conf (which proxied the root domain to the backend);
# the App talks to api.hiogolf.cn, so the root domain is free for the website.
#
# Deploy:
#   git clone https://github.com/HIOGolfApp/HIOWebAPP.git /opt/hio-website   (once)
#   cp /opt/hio-website/nginx/hiogolf-site.conf /etc/nginx/conf.d/hiogolf-site.conf
#   rm -f /etc/nginx/conf.d/aigolf-root.conf
#   nginx -t && systemctl reload nginx
# Update:
#   cd /opt/hio-website && git pull        (static files; no reload needed)

# WebSocket upgrade map used by aigolf.conf / aigolf-ip.conf proxy headers;
# it used to live in the retired aigolf-root.conf, so it moves here with the
# root-domain takeover (conf.d files are included at http level).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hiogolf.cn www.hiogolf.cn;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.14 on the CVM: old-style http2 flag on listen (http2-on directive is 1.25+)
    listen 443 ssl http2;
    server_name hiogolf.cn www.hiogolf.cn;

    ssl_certificate     /etc/nginx/ssl/hiogolf.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/hiogolf.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hio-website;
    index index.html;

    # same-origin proxy for the public, no-auth endpoints only
    # (/public-api/v1/public/... -> backend /api/v1/public/...)
    location /public-api/v1/public/ {
        proxy_pass http://aigolf_app/api/v1/public/;   # blue/green upstream, see /etc/nginx/conf.d/aigolf-upstream.conf
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
